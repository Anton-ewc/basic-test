apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: test-app
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: test-app
            repoUrl: "https://github.com/Anton-ewc/basic-test.git"
            path: "manifests"
            revision: "main"
            destinationNamespace: "default"
            destinationServer: "https://kubernetes.default.svc"
  template:
    metadata:
      name: "{{name}}"
    spec:
      project: default
      source:
        repoURL: "{{repoUrl}}"
        path: "{{path}}"
        targetRevision: main
        plugin:
          name: image-overloader
      destination:
        server: "{{destinationServer}}"
        namespace: "{{destinationNamespace}}"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
      hooks:
        - manifest: |
            apiVersion: argoproj.io/v1alpha1
            kind: Workflow
            metadata:
              name: build-image-{{name}}
              namespace: {{destinationNamespace}}
              annotations:
                argocd.argoproj.io/hook: PreSync
                argocd.argoproj.io/hook-delete-policy: HookSucceeded
            spec:
              workflowTemplateRef:
                name: build-docker-image
                clusterScope: true
              arguments:
                parameters:
                  - name: repoUrl
                    value: "git://{{repoUrl}}"
                  - name: revision
                    value: "{{revision}}"
                  - name: context
                    value: "{{path}}"
                  - name: dockerfile
                    value: "Dockerfile"
                  - name: appName
                    value: "{{name}}"
                  - name: tmpxx
                    value: "{{name}}"